<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="logotype.png" type="image/png">
    <title>Удалить из ПО | WB PVZ</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== Страница «Удалить из ПО» ===== */
        .dsp-shell { flex: 1 1 auto; min-height: 0; display: flex; gap: 20px; background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 20px; overflow: hidden; }

        /* Левая панель */
        .dsp-left { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; padding-right: 20px; border-right: 1px solid var(--border-color); }
        .dsp-count-plaque { background: var(--gray-light); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 15px; display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        .dsp-count-label { font-size: 0.85rem; color: #000; }
        .dsp-count-number { font-size: 4rem; font-weight: 900; line-height: 1; color: var(--text-primary-color); margin-top: 6px; }
        .dsp-count-sub { font-size: 0.8rem; color: var(--text-secondary-color); margin-top: 6px; }
        .dsp-delete-btn { width: 100%; min-height: 64px; padding: 12px 16px; border: none; border-radius: var(--radius-rect); background: var(--error); color: var(--white); font-size: 1.05rem; font-weight: 600; line-height: 1.25; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s, transform 0.2s; }
        .dsp-delete-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .dsp-delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Правая часть */
        .dsp-right { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .dsp-scan-row { flex-shrink: 0; margin-bottom: 15px; }
        .dsp-scan-input { width: 100%; padding: 14px 15px; font-size: 1.2rem; text-align: center; letter-spacing: 1px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); }
        .dsp-scan-input.dsp-shake { animation: dspShake 0.3s; border-color: var(--error); }
        @keyframes dspShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .dsp-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; align-content: start; overflow-y: auto; padding: 4px 5px 10px 4px; }

        /* Карточка товара */
        .dsp-card { position: relative; display: flex; flex-direction: column; min-height: 420px; padding: 12px; background: var(--white); border: 2px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; overflow: hidden; transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s; user-select: none; -webkit-user-select: none; }
        .dsp-card:hover { box-shadow: var(--shadow-md); }
        .dsp-card.selected { border-color: var(--primary); background: var(--light-purple-bg); }
        .dsp-card.dsp-flash { animation: dspFlash 0.8s; }
        @keyframes dspFlash { 0% { box-shadow: 0 0 0 0 rgba(167,58,253,0.6); } 100% { box-shadow: 0 0 0 14px rgba(167,58,253,0); } }

        .dsp-card-top { position: relative; flex-shrink: 0; background: var(--gray-lightest); border-radius: var(--radius-sm); padding: 10px 15px 12px 55px; display: flex; flex-direction: column; align-items: flex-end; text-align: right; margin-bottom: 10px; min-height: 100px; }
        .dsp-card.selected .dsp-card-top { background: var(--white); }
        .dsp-check { position: absolute; top: 10px; left: 10px; z-index: 6; }
        .dsp-cell-label { font-size: 1rem; font-weight: 500; color: var(--text-secondary-color); }
        .dsp-cell-number { font-size: 4.5rem; font-weight: 300; line-height: 0.95; color: var(--text-primary-color); margin-top: 4px; }
        .dsp-defect { position: absolute; top: 12px; right: 12px; background: var(--error); color: var(--white); font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; z-index: 5; }
        .dsp-card-top.has-defect .dsp-cell-label { margin-top: 22px; }

        .dsp-img { flex: 1 1 0; min-height: 150px; background: var(--gray-lightest); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; font-size: 5rem; }
        .dsp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .dsp-info { flex-shrink: 0; text-align: left; }
        .dsp-code { font-family: 'Roboto Mono', monospace; font-size: 1.5rem; line-height: 1.1; font-weight: 500; color: #b5b5b5; white-space: nowrap; overflow: hidden; margin-bottom: 4px; }
        .dsp-code b { color: #000; font-weight: 700; }
        .dsp-name { font-size: 1rem; font-weight: 500; line-height: 1.3; color: var(--text-primary-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dsp-date { font-size: 0.8rem; color: var(--text-secondary-color); margin-top: 4px; }

        .dsp-empty { grid-column: 1 / -1; text-align: center; color: var(--text-secondary-color); padding: 40px 10px; }
        .dsp-empty img { max-width: 160px; opacity: 0.8; margin-bottom: 10px; }

        /* Окно подтверждения */
        .dsp-confirm-box { max-width: 460px; }
        .dsp-confirm-text { font-size: 1.15rem; line-height: 1.4; margin: 20px 0 5px; color: var(--text-primary-color); }
        .dsp-modal-buttons { display: flex; flex-direction: row; gap: 12px; width: 100%; margin-top: 22px; }
        .dsp-modal-buttons button { flex: 1 1 0; width: auto; padding: 14px 10px; font-size: 1.05rem; font-weight: 600; border-radius: var(--radius-rect); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
        .dsp-btn-no { background: var(--white); color: var(--text-primary-color); border: 1px solid var(--border-color); }
        .dsp-btn-no:hover { background: var(--gray-light); }
        .dsp-btn-yes { background: var(--error); color: var(--white); border: none; }
        .dsp-btn-yes:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .dsp-shell { flex-direction: column; padding: 15px; gap: 15px; }
            .dsp-left { width: 100%; flex-direction: row; align-items: stretch; padding-right: 0; padding-bottom: 15px; border-right: none; border-bottom: 1px solid var(--border-color); }
            .dsp-count-plaque { flex: 1 1 50%; }
            .dsp-count-number { font-size: 3rem; }
            .dsp-delete-btn { flex: 1 1 50%; width: auto; min-height: 0; }
            .dsp-grid { grid-template-columns: minmax(0, 1fr); }
            .dsp-modal-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="data-loader" style="display: none;">
        <div class="spinner"></div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-logo"><img src="logotype.png" alt="WB" class="wb-icon"><div class="sidebar-version"><br></div></div>
             <div class="sidebar-menu">
                <div class="menu-item" onclick="location.href='returns.html'">
                     <img src="accept.svg" alt="Товары" class="menu-icon">
                    <span>Товары</span>
                     <div class="menu-badge" id="returns-sidebar-badge" style="display: none;">0</div>
                </div>
                <div class="menu-item" onclick="location.href='r2.html'">
                    <img src="box_delivery.svg" alt="Коробки" class="menu-icon">
                    <span>Коробки</span>
                </div>
                <div class="menu-item" onclick="location.href='r3.html'">
                    <img src="cardboard.svg" alt="Картон" class="menu-icon">
                    <span>Картон</span>
                </div>
                <div class="menu-item active" onclick="location.href='r4.html'">
                     <img src="trash.svg" alt="Утиль" class="menu-icon">
                    <span>Удалить из ПО</span>
                     <div class="menu-badge" id="disposal-sidebar-badge" style="display: none;">0</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <header id="desktop-header-container"></header>
            <div class="dsp-shell">
                <div class="dsp-left">
                    <div class="dsp-count-plaque">
                        <div class="dsp-count-label">Количество товаров</div>
                        <div class="dsp-count-number" id="disposal-count">0</div>
                        <div class="dsp-count-sub" id="disposal-count-sub">из 0 к удалению</div>
                    </div>
                    <button id="dispose-all-btn" class="dsp-delete-btn" disabled>
                        <span>Удалить из<br>программы</span>
                    </button>
                </div>
                <div class="dsp-right">
                    <div class="dsp-scan-row">
                        <input type="text" id="disposal-scan-input" class="dsp-scan-input" inputmode="numeric" autocomplete="off" autofocus placeholder="Отсканируйте ШК или введите 10 цифр">
                    </div>
                    <div id="disposal-container" class="dsp-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="help-menu side-panel" id="help-menu"></div>
    <div class="fullscreen-modal" id="search-modal"></div>
    <div class="fullscreen-modal" id="qr-code-modal"></div>
    <div class="fullscreen-modal" id="main-settings-modal"></div>
    <div class="fullscreen-modal" id="voice-settings-modal"></div>
    <div class="fullscreen-modal" id="scanner-setup-modal"></div>
    <div class="fullscreen-modal" id="account-modal"></div>

    <div class="fullscreen-modal" id="disposal-confirm-modal">
        <div class="modal-content dsp-confirm-box">
            <button class="close-modal-btn">&times;</button>
            <p id="disposal-confirm-text" class="dsp-confirm-text">Вы уверены, что хотите удалить товары из программы в количестве 0 штук?</p>
            <div class="dsp-modal-buttons">
                <button id="disposal-cancel-btn" class="dsp-btn-no">Нет, оставить</button>
                <button id="disposal-confirm-btn" class="dsp-btn-yes">Да, удалить</button>
            </div>
        </div>
    </div>

   <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
   <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
   <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="speaker.js"></script>
    <script src="r4.js"></script>
    <script src="p_shared.js"></script>
</body>
</html>
